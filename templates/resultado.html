<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8" />

    <!-- Adapta a página para telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Define o título da página -->
    <title>Relatório gerado | Módulo 8</title>

    <!-- Carrega os estilos compartilhados do projeto -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- Área principal do resultado -->
    <main class="container">
      <!-- Cabeçalho da página de resultado -->
      <header class="report-header">
        <p class="eyebrow">MÓDULO 8</p>

        <h1>Relatório gerado</h1>

        <p>Relatório criado com auxílio da inteligência artificial.</p>
      </header>

      <!-- Apresenta o relatório convertido e sanitizado -->
      <article class="report-content">{{ relatorio | safe }}</article>

      <!-- Formulário para baixar o relatório em Markdown -->
      <form method="POST" action="{{ url_for('baixar_relatorio') }}">
        <!-- Envia o conteúdo Markdown original para a rota de download -->
        <input
          type="hidden"
          name="relatorio_markdown"
          value="{{ relatorio_markdown }}"
        />

        <!-- Botão para baixar o arquivo -->
        <button type="submit">Baixar relatório (.md)</button>
      </form>

      <!-- Permite gerar outro relatório -->
      <a class="button-link" href="/"> Gerar outro relatório </a>
    </main>
  </body>
</html>
