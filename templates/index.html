
<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8" />

    <!-- Adapta a página para celulares e telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Define o título exibido na aba do navegador -->
    <title>Módulo 8 | Geração de Relatórios</title>

    <!-- Carrega o arquivo de estilos do projeto -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- Área principal da página -->
    <main class="container">
      <!-- Cabeçalho do sistema -->
      <header>
        <p class="eyebrow">MÓDULO 8</p>

        <h1>Assistente de Relatórios</h1>

        <p>
          Gere relatórios de Engenharia de Software com auxílio da inteligência
          artificial.
        </p>
      </header>

      <!-- Exibe mensagens de erro, caso existam -->
      {% if erro %}
      <p class="error-message" role="alert">{{ erro }}</p>
      {% endif %}

      <!-- Formulário de geração de relatórios -->
      <form
        method="POST"
        action="{{ url_for('gerar_relatorio') }}"
        enctype="multipart/form-data"
      >
        <!-- Seleção do perfil do usuário -->
        <div class="form-group">
          <label for="perfil">Perfil do usuário</label>

          <select id="perfil" name="perfil" required>
            <option value="">Selecione seu perfil</option>

            <option value="Aluno / Desenvolvedor">
              Aluno / Desenvolvedor
            </option>

            <option value="Professor / PO">Professor / PO</option>

            <option value="Coordenador / Gestor do Projeto">
              Coordenador / Gestor do Projeto
            </option>
          </select>
        </div>

        <!-- Seleção do tipo de relatório -->
        <div class="form-group">
          <label for="tipo_relatorio">Tipo de relatório</label>

          <select id="tipo_relatorio" name="tipo_relatorio" required>
            <option value="">Selecione o tipo de relatório</option>

            <option value="tecnico">Relatório técnico</option>

            <option value="arquitetura">Relatório de arquitetura</option>

            <option value="progresso">Relatório de progresso</option>

            <option value="estudo">Recomendações de estudo</option>
          </select>
        </div>

        <!-- Dados digitados do projeto -->
        <div class="form-group">
          <label for="dados">Dados do projeto</label>

          <textarea
            id="dados"
            name="dados"
            placeholder="Informe requisitos, tarefas, funcionalidades, tecnologias ou andamento do projeto."
            required
          ></textarea>
        </div>

        <!-- Upload de documentos do projeto -->
        <div class="form-group">
          <label for="arquivos">Documentos do projeto (opcional)</label>

          <input
            type="file"
            id="arquivos"
            name="arquivos"
            accept=".pdf,.txt,.md"
            multiple
          />

          <small>
            Formatos aceitos: PDF, TXT e MD. Até 3 arquivos, com no máximo
            5 MB cada.
          </small>
        </div>

        <!-- Solicitação específica do usuário -->
        <div class="form-group">
          <label for="solicitacao">O que deseja no relatório?</label>

          <textarea
            id="solicitacao"
            name="solicitacao"
            placeholder="Ex.: Explique as funcionalidades implementadas e recomende melhorias para o projeto."
            required
          ></textarea>
        </div>

        <!-- Botão para enviar os dados e gerar o relatório -->
        <button type="submit">Gerar relatório</button>
      </form>
    </main>
  </body>
</html>
