<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8" />

    <!-- Adapta a página para celulares e telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Define o título exibido na aba do navegador -->
    <title>Módulo 8 | Geração de Relatórios</title>

    <!-- Carrega o arquivo de estilos do projeto -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <!-- Área principal da página -->
    <main class="container">
      <!-- Cabeçalho do sistema -->
      <header>
        <p class="eyebrow">MÓDULO 8</p>

        <h1>Assistente de Relatórios</h1>

        <p>
          Gere relatórios de Engenharia de Software com auxílio da inteligência
          artificial.
        </p>
      </header>

      <!-- Exibe uma mensagem caso algum campo esteja vazio -->
      {% if erro %}
      <p class="error-message" role="alert">{{ erro }}</p>
      {% endif %}

      <!-- Formulário enviado para a rota /gerar -->
      <form method="POST" action="/gerar">
        <!-- Seleção do perfil do usuário -->
        <div class="form-group">
          <label for="perfil">Perfil do usuário</label>

          <select id="perfil" name="perfil" required>
            <option value="">Selecione seu perfil</option>

            <option value="Aluno / Desenvolvedor">Aluno / Desenvolvedor</option>

            <option value="Professor / PO">Professor / PO</option>

            <option value="Coordenador / Gestor do Projeto">
              Coordenador / Gestor do Projeto
            </option>
          </select>
        </div>

        <!-- Campo para informar os dados do projeto -->
        <div class="form-group">
          <label for="dados">Dados do projeto</label>

          <textarea
            id="dados"
            name="dados"
            placeholder="Informe requisitos, tarefas, funcionalidades, andamento ou outros dados do projeto."
            required
          ></textarea>
        </div>

        <!-- Campo para descrever o relatório desejado -->
        <div class="form-group">
          <label for="solicitacao">Solicitação do relatório</label>

          <textarea
            id="solicitacao"
            name="solicitacao"
            placeholder="Ex.: Gere um relatório técnico sobre o andamento e os principais resultados do projeto."
            required
          ></textarea>
        </div>

        <!-- Botão que envia os dados para o servidor -->
        <button type="submit">Gerar relatório</button>
      </form>
    </main>
  </body>
</html>
