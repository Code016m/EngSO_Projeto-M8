
name: Build and deploy Python app to Azure Web App - engsoft-m8-proj-10419556

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.venv/
            !.env
            !.pytest_cache/
            !__pycache__/
            !antenv/

  deploy:
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA44CB2A94214A0BBE79EB86C5F892CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_537979F8870140F89DA03E84ABF9DBED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8E5AF41DECC845F6B02371DCC06BC227 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: engsoft-m8-proj-10419556
          slot-name: Production
          